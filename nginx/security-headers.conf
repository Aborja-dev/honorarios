# Cabeceras de seguridad. Se incluye en cada `location` porque `add_header` no se hereda
# entre niveles: si un `location` declara el suyo, pierde los del `server`.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://www.snd.gob.mx; font-src 'self' https://www.snd.gob.mx; img-src 'self' data: https://www.snd.gob.mx https://framework-gb.cdn.gob.mx; connect-src 'self' https://www.snd.gob.mx https://framework-gb.cdn.gob.mx; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
