server {
    listen 5000;
    listen [::]:5000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash en el nombre (js, css y fuentes): no cambian nunca para un mismo nombre.
    # La expresión va entre comillas: nginx interpreta las llaves sin comillas como un bloque.
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|ttf|eot)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Todo lo demás (index.html, favicon, texturas, rutas de la aplicación): la aplicación de una sola
    # página responde index.html para cualquier ruta que no sea un archivo, y se revalida siempre.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
